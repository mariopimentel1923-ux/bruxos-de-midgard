name: Gerar APK Bruxos de Midgard

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Baixar Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Baixar templates de exportacao
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Preparar Android
        run: |
          ./godot --headless --editor --quit

      - name: Gerar APK
        run: |
          mkdir -p build
          ./godot --headless --export-debug "Android" build/bruxos-de-midgard.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: Bruxos-de-Midgard-APK
          path: build/bruxos-de-midgard.apk
          if-no-files-found: error

      - name: Criar Release de teste
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste-${{ github.run_number }}
          name: Bruxos de Midgard - Teste ${{ github.run_number }}
          prerelease: true
          files: build/bruxos-de-midgard.apk
